# conda create -p /opt/dlami/nvme/envs/bloom-umaps -c conda-forge --override-channels ...
# umap-learn / scikit-learn / numba / pynndescent pinned to match bloom-figures (2026-11-07)
name: bloom-umaps
channels: [conda-forge]
dependencies:
  - python=3.12
  - pip
  - umap-learn=0.5.12
  - scikit-learn=1.9.0
  - numba=0.67.0
  - pynndescent=0.6.0
  - numpy
  - scipy
  - pandas
  - pyarrow
  - h5py
  - anndata
  - matplotlib
  - joblib
  - threadpoolctl
  - pytest
  - ruff
